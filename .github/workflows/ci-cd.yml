
name: FastAPI Project CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # CI: Test and lint
  test:
    name: Test and lint backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: ruff check backend/

      - name: Run Pytest
        run: pytest backend/tests/ -v

  # Build and publish Docker images
  build:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image names
        id: images
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=${REPO}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REPO}-frontend" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.images.outputs.backend }}:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.images.outputs.frontend }}:${{ github.sha }}

          
  deploy:
      name: Deploy to MiniStack
      needs: build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      env:
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1
        AWS_ENDPOINT_URL: ${{ env.MINISTACK_ENDPOINT || 'http://localhost:4566' }}

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Start MiniStack (ephemeral)
          if: ${{ env.MINISTACK_ENDPOINT == '' }}
          run: |
            docker run -d --name ministack -p 4566:4566 \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ministackorg/ministack
            for i in $(seq 1 30); do
              curl -sf http://localhost:4566/_ministack/health && exit 0
              sleep 2
            done
            docker logs ministack
            exit 1

        - name: Deploy infrastructure
          run: |
            # Replace with your real deploy step, e.g. Terraform:
            # terraform -chdir=infra init
            # terraform -chdir=infra apply -auto-approve \
            #   -var "image_tag=${{ github.sha }}"
            aws sts get-caller-identity

        - name: Smoke test
          run: |
            curl -sf "$AWS_ENDPOINT_URL/_ministack/health"
            # curl -sf <your deployed backend URL>/health


